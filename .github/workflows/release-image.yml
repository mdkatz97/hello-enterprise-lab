name: release-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      IMAGE: ghcr.io/mdkatz97/hello-enterprise

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable multi-architecture emulation
        uses: docker/setup-qemu-action@v3

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Keyless-sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-image.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

  promote:
    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}
      DIGEST: ${{ needs.build.outputs.digest }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update production image digest
        run: |
          set -euo pipefail
          sed -E -i \
            "s#digest: sha256:[0-9a-f]{64}#digest: ${DIGEST}#" \
            deploy/overlays/prod/kustomization.yaml

      - name: Open promotion pull request
        run: |
          set -euo pipefail
          BRANCH="promote/${GITHUB_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"
          git add deploy/overlays/prod/kustomization.yaml
          git commit -m "Promote image ${GITHUB_SHA}"
          git push --force-with-lease origin "${BRANCH}"

          gh pr view "${BRANCH}" >/dev/null 2>&1 || \
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "Promote image ${GITHUB_SHA}" \
              --body "Promotes signed image digest ${DIGEST}."
