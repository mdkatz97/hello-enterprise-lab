apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: hello-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: hello-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
